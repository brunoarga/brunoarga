<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="xpBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Fondo estilo pantalla HUD -->
  <rect x="2" y="2" width="836" height="92" rx="10" fill="url(#hudBg)" stroke="#7C3AED" stroke-width="2" />

  <!-- Esquinas estilo mira de videojuego -->
  <path d="M12 22 L12 12 L26 12" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M828 22 L828 12 L814 12" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M12 74 L12 84 L26 84" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M828 74 L828 84 L814 84" fill="none" stroke="#10B981" stroke-width="2.5" />

  <!-- Indicador de estado LIVE / PLAYER 1 -->
  <circle cx="28" cy="24" r="4.5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <text x="40" y="28" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1.5">
    PLAYER 1 // SYSTEM READY
  </text>

  <!-- Barra de XP / Energía animada arriba a la derecha -->
  <text x="580" y="27" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="11" font-weight="700" fill="#A855F7">
    EXP
  </text>
  <rect x="610" y="18" width="200" height="10" rx="3" fill="#21262D" stroke="#30363D" stroke-width="1" />
  <rect x="612" y="20" width="40" height="6" rx="2" fill="url(#xpBar)">
    <animate attributeName="width" values="35;196;165;196" dur="4.5s" repeatCount="indefinite" />
  </rect>

  <!-- Nave / Proyectil pixel-art patrullando -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="20 37" to="800 37" dur="5s" repeatCount="indefinite" />
    <!-- Cuerpo pixel-art de nave -->
    <rect x="6" y="0" width="4" height="2" fill="#A855F7" />
    <rect x="4" y="2" width="8" height="2" fill="#A855F7" />
    <rect x="0" y="4" width="16" height="2" fill="#10B981" />
    <rect x="2" y="6" width="3" height="2" fill="#F59E0B" />
    <rect x="11" y="6" width="3" height="2" fill="#F59E0B" />
  </g>

  <!-- Título principal estilo terminal gamer -->
  <text x="26" y="69" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="18.5" font-weight="700" fill="#F0F6FC">
    <tspan fill="#A855F7">>_ </tspan>
    <tspan>Full-Stack Software Developer</tspan>
    <tspan fill="#10B981"> · </tspan>
    <tspan fill="#D2A8FF">QA Automation</tspan>
    <tspan fill="#10B981"> · </tspan>
    <tspan fill="#79C0FF">DevOps & CI/CD</tspan>
    <tspan fill="#10B981"> █
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
    </tspan>
  </text>
</svg>
