<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230">
  <defs>
    <!-- Cielo atardecer Vice City / GTA VI -->
    <linearGradient id="viceSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B2E">
        <animate attributeName="stop-color" values="#1A0B2E;#2D1042;#1A0B2E" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="52%" stop-color="#9D174D">
        <animate attributeName="stop-color" values="#9D174D;#BE185D;#7E22CE;#9D174D" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#F97316">
        <animate attributeName="stop-color" values="#F97316;#EC4899;#F59E0B;#F97316" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Sol retro Vice -->
    <linearGradient id="viceSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <!-- Brillo texto principal -->
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="836" height="226" rx="14" />
    </clipPath>
  </defs>

  <!-- Marco exterior neón -->
  <rect x="2" y="2" width="836" height="226" rx="14" fill="url(#viceSky)" stroke="#F472B6" stroke-width="2.5" />

  <g clip-path="url(#cardClip)">
    <!-- Sol retro gigante al fondo -->
    <circle cx="670" cy="145" r="76" fill="url(#viceSun)" opacity="0.92">
      <animate attributeName="cy" values="145;140;145" dur="6s" repeatCount="indefinite" />
    </circle>
    <!-- Líneas de escaneo sobre el sol -->
    <rect x="580" y="152" width="180" height="4" fill="#4C0519" opacity="0.55" />
    <rect x="580" y="164" width="180" height="5" fill="#4C0519" opacity="0.65" />
    <rect x="580" y="178" width="180" height="6" fill="#4C0519" opacity="0.75" />
    <rect x="580" y="194" width="180" height="8" fill="#4C0519" opacity="0.85" />

    <!-- Horizonte / Ciudad en silueta -->
    <path d="M0 195 L60 195 L60 165 L95 165 L95 185 L140 185 L140 150 L185 150 L185 180 L240 180 L240 160 L290 160 L290 190 L520 190 L520 158 L555 158 L555 182 L600 182 L600 148 L635 148 L635 185 L840 185 L840 230 L0 230 Z" fill="#090514" opacity="0.88" />

    <!-- Palmera derecha con movimiento suave -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 765 228; 2.2 765 228; 0 765 228" dur="4.5s" repeatCount="indefinite" />
      <path d="M762 228 Q755 165 742 118 L750 118 Q765 165 770 228 Z" fill="#090514" />
      <path d="M746 120 Q715 102 692 122 Q718 114 745 125 Z" fill="#090514" />
      <path d="M746 118 Q722 86 696 92 Q722 96 745 121 Z" fill="#090514" />
      <path d="M747 118 Q768 85 796 94 Q770 96 748 121 Z" fill="#090514" />
      <path d="M747 120 Q780 105 804 126 Q778 116 748 125 Z" fill="#090514" />
    </g>

    <!-- HUD Estilo GTA arriba a la derecha -->
    <g transform="translate(565, 18)">
      <rect x="0" y="0" width="250" height="58" rx="8" fill="#090514" opacity="0.72" stroke="#F472B6" stroke-width="1.2" />
      <text x="14" y="21" font-family="Impact, Arial Black, sans-serif" font-size="14" fill="#FDE047" letter-spacing="1.5">
        JUJUY // FULL-STACK
      </text>
      <text x="14" y="42" font-family="monospace" font-size="12" font-weight="700" fill="#34D399">
        WANTED STACK: ★★★★★
      </text>
      <!-- Destello animado sobre las estrellas -->
      <circle cx="222" cy="37" r="4" fill="#FDE047">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Etiqueta superior estilo Vice -->
    <rect x="34" y="26" width="188" height="24" rx="4" fill="#EC4899" />
    <text x="45" y="42" font-family="monospace" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      DEV EDITION // VI
    </text>

    <!-- Nombre Principal estilo portada GTA -->
    <text x="34" y="106" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#090514" letter-spacing="2">
      BRUNO ARGAÑARAZ
    </text>
    <text x="31" y="103" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="url(#neonText)" letter-spacing="2">
      BRUNO ARGAÑARAZ
    </text>

    <!-- Subtítulo neón -->
    <text x="34" y="138" font-family="monospace" font-size="15" font-weight="700" fill="#FBCFE8" letter-spacing="1">
      SOFTWARE ENGINEER · QA AUTOMATION · CI/CD ARCHITECT
    </text>

    <!-- Barra inferior estilo misión activa -->
    <rect x="34" y="158" width="465" height="30" rx="6" fill="#090514" opacity="0.82" stroke="#A855F7" stroke-width="1.2" />
    <circle cx="50" cy="173" r="4.5" fill="#F43F5E">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="64" y="177" font-family="monospace" font-size="12.5" font-weight="700" fill="#FDE047">
      CURRENT MISSION: BUILDING SCALABLE SYSTEMS
    </text>
  </g>
</svg>
